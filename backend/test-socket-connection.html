<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO 连接测试</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        #messages { max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
    <h1>Socket.IO 连接测试</h1>
    <div id="status" class="status info">正在连接...</div>
    <div id="messages"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');

        function addMessage(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        try {
            addMessage('开始连接Socket.IO...');
            
            // 尝试连接到后端
            const socket = io('http://localhost:5001', {
                transports: ['polling'], // 只使用polling
                timeout: 30000,
                forceNew: true,
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000
            });

            socket.on('connect', () => {
                updateStatus('✅ 连接成功！Socket ID: ' + socket.id, 'success');
                addMessage('连接成功', 'success');
            });

            socket.on('disconnect', (reason) => {
                updateStatus('❌ 连接断开: ' + reason, 'error');
                addMessage('连接断开: ' + reason, 'error');
            });

            socket.on('connect_error', (error) => {
                updateStatus('❌ 连接错误: ' + error.message, 'error');
                addMessage('连接错误: ' + error.message, 'error');
                console.error('Socket.IO 连接错误:', error);
            });

            socket.on('reconnect', (attemptNumber) => {
                updateStatus('✅ 重连成功！尝试次数: ' + attemptNumber, 'success');
                addMessage('重连成功，尝试次数: ' + attemptNumber, 'success');
            });

            socket.on('reconnect_error', (error) => {
                addMessage('重连失败: ' + error.message, 'error');
            });

            socket.on('reconnect_failed', () => {
                updateStatus('❌ 重连失败，已达到最大尝试次数', 'error');
                addMessage('重连失败，已达到最大尝试次数', 'error');
            });

            socket.on('statusUpdate', (data) => {
                addMessage('状态更新: ' + data.message, 'info');
            });

            socket.on('error', (data) => {
                addMessage('错误: ' + data.message, 'error');
            });

        } catch (error) {
            updateStatus('❌ 初始化错误: ' + error.message, 'error');
            addMessage('初始化错误: ' + error.message, 'error');
            console.error('初始化错误:', error);
        }
    </script>
</body>
</html>
