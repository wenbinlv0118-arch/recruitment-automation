<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO 连接测试</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>
    <h1>Socket.IO 连接测试</h1>
    <div id="status">正在连接...</div>
    <div id="messages"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');

        function addMessage(message) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            messagesDiv.appendChild(div);
        }

        try {
            // 尝试连接到后端
            const socket = io('http://localhost:5001');

            socket.on('connect', () => {
                statusDiv.textContent = '✅ 连接成功！Socket ID: ' + socket.id;
                addMessage('连接成功');
            });

            socket.on('disconnect', () => {
                statusDiv.textContent = '❌ 连接断开';
                addMessage('连接断开');
            });

            socket.on('connect_error', (error) => {
                statusDiv.textContent = '❌ 连接错误: ' + error.message;
                addMessage('连接错误: ' + error.message);
                console.error('Socket.IO 连接错误:', error);
            });

            socket.on('statusUpdate', (data) => {
                addMessage('状态更新: ' + data.message);
            });

            socket.on('error', (data) => {
                addMessage('错误: ' + data.message);
            });

        } catch (error) {
            statusDiv.textContent = '❌ 初始化错误: ' + error.message;
            addMessage('初始化错误: ' + error.message);
            console.error('初始化错误:', error);
        }
    </script>
</body>
</html>
