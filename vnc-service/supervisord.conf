[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_VNC_RESOLUTION)sx24 -ac +extension GLX +render -noreset -dpi 96 -nolisten tcp
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log
priority=100
startsecs=3
startretries=5
stopwaitsecs=5

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
autorestart=true
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.log
priority=200
startsecs=2
startretries=3
stopwaitsecs=5

[program:x11vnc]
command=/usr/bin/x11vnc -forever -usepw -create -rfbauth /root/.vnc/passwd -rfbport %(ENV_VNC_PORT)s -display :1 -noxrecord -noxfixes -noxdamage -wait 3 -shared -permitfiletransfer -threads -nap -defer 10
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log
priority=300
startsecs=5
startretries=5
stopwaitsecs=8

[program:novnc]
command=/opt/noVNC/utils/novnc_proxy --vnc localhost:%(ENV_VNC_PORT)s --listen %(ENV_NO_VNC_PORT)s --web /opt/noVNC
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log
priority=400
startsecs=3
startretries=3
stopwaitsecs=5

[program:browser]
command=/bin/bash -c "sleep 15 && /usr/local/bin/start-browser.sh"
environment=DISPLAY=":1",HOME="/root",USER="root"
autorestart=true
stdout_logfile=/var/log/supervisor/browser.log
stderr_logfile=/var/log/supervisor/browser.log
priority=500
startsecs=15
startretries=5
exitcodes=0,1,2
stopwaitsecs=10
autorestart_delay=20