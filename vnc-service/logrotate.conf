# VNC服务日志轮转配置
# 防止日志文件过大，定期清理和压缩日志

/var/log/supervisor/*.log {
    # 每日轮转
    daily
    
    # 保留7天的日志
    rotate 7
    
    # 压缩旧日志文件
    compress
    
    # 延迟压缩，保留最新的一个轮转文件不压缩
    delaycompress
    
    # 如果日志文件不存在，不报错
    missingok
    
    # 如果日志文件为空，不轮转
    notifempty
    
    # 创建新日志文件的权限
    create 644 root root
    
    # 轮转后执行的脚本
    postrotate
        # 重新加载supervisor以重新打开日志文件
        if [ -f /var/run/supervisord.pid ]; then
            kill -USR2 `cat /var/run/supervisord.pid`
        fi
    endscript
    
    # 当日志文件大小超过10MB时也进行轮转
    size 10M
    
    # 使用日期作为后缀
    dateext
    
    # 日期格式
    dateformat -%Y%m%d
    
    # 复制并截断原文件，而不是移动
    copytruncate
}

# 特殊处理浏览器日志，因为它可能产生大量输出
/var/log/supervisor/browser.log {
    daily
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    size 5M
    dateext
    dateformat -%Y%m%d
    copytruncate
    
    # 浏览器日志轮转后的特殊处理
    postrotate
        echo "$(date): Browser log rotated" >> /var/log/supervisor/logrotate.log
    endscript
}

# Supervisor主日志
/var/log/supervisor/supervisord.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    size 20M
    dateext
    copytruncate
}