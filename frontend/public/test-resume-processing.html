<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历处理与入库功能测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
        }
        .test-section h3 {
            margin-top: 0;
            color: #1890ff;
        }
        .button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .button:hover {
            background: #40a9ff;
        }
        .button.danger {
            background: #ff4d4f;
        }
        .button.danger:hover {
            background: #ff7875;
        }
        .button.success {
            background: #52c41a;
        }
        .button.success:hover {
            background: #73d13d;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 4px;
        }
        .error {
            background: #fff2f0;
            border-color: #ffccc7;
        }
        .info {
            background: #e6f7ff;
            border-color: #91d5ff;
        }
        .resume-card {
            border: 1px solid #e8e8e8;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            background: #fafafa;
        }
        .resume-card.liked {
            border-color: #52c41a;
            background: #f6ffed;
        }
        .resume-card.disliked {
            border-color: #ff4d4f;
            background: #fff2f0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #e8e8e8;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #1890ff;
        }
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        .filter-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .filter-control {
            padding: 10px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }
        .filter-control label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .filter-control select,
        .filter-control input {
            width: 100%;
            padding: 5px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
        }
        .batch-actions {
            margin: 20px 0;
            padding: 15px;
            background: #f0f8ff;
            border-radius: 6px;
            border: 1px solid #91d5ff;
        }
        .upload-area {
            border: 2px dashed #d9d9d9;
            padding: 40px;
            text-align: center;
            border-radius: 6px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #1890ff;
            background: #f0f8ff;
        }
        .upload-area.active {
            border-color: #52c41a;
            background: #f6ffed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>简历处理与入库功能测试页面</h1>
        <p>此页面用于测试第六阶段的各项功能，包括自动收藏、简历入库、智能筛选、点赞点踩等。</p>

        <!-- 自动收藏测试 -->
        <div class="test-section">
            <h3>自动收藏功能测试</h3>
            <p>测试候选人自动收藏和收藏上限管理功能</p>
            
            <button class="button" onclick="testAutoCollection()">测试自动收藏</button>
            <button class="button" onclick="testCollectionLimit()">测试收藏上限</button>
            <button class="button" onclick="resetCollectionCount()">重置收藏计数</button>
            
            <div id="collection-result" class="result" style="display: none;"></div>
        </div>

        <!-- 简历入库测试 -->
        <div class="test-section">
            <h3>简历入库功能测试</h3>
            <p>测试简历数据验证、标准化和入库流程</p>
            
            <button class="button" onclick="testResumeStorage()">测试简历入库</button>
            <button class="button" onclick="testDataValidation()">测试数据验证</button>
            <button class="button" onclick="testDataNormalization()">测试数据标准化</button>
            
            <div id="storage-result" class="result" style="display: none;"></div>
        </div>

        <!-- 智能筛选测试 -->
        <div class="test-section">
            <h3>智能筛选功能测试</h3>
            <p>测试简历筛选、排序和批量操作功能</p>
            
            <div class="filter-controls">
                <div class="filter-control">
                    <label>质量评分范围</label>
                    <input type="range" id="quality-range" min="0" max="100" value="60" oninput="updateQualityRange()">
                    <span id="quality-value">60分</span>
                </div>
                <div class="filter-control">
                    <label>工作经验</label>
                    <select id="experience-filter" onchange="applyFilters()">
                        <option value="all">全部</option>
                        <option value="junior">初级(1-2年)</option>
                        <option value="middle">中级(3-4年)</option>
                        <option value="senior">资深(5年+)</option>
                    </select>
                </div>
                <div class="filter-control">
                    <label>职位类型</label>
                    <select id="position-filter" onchange="applyFilters()">
                        <option value="all">全部</option>
                        <option value="frontend">前端开发</option>
                        <option value="backend">后端开发</option>
                        <option value="fullstack">全栈开发</option>
                        <option value="product">产品经理</option>
                        <option value="design">设计师</option>
                    </select>
                </div>
                <div class="filter-control">
                    <label>关键词搜索</label>
                    <input type="text" id="keyword-search" placeholder="搜索姓名、职位、公司等" oninput="applyFilters()">
                </div>
            </div>
            
            <div class="batch-actions">
                <h4>批量操作</h4>
                <button class="button success" onclick="batchLike()">批量点赞</button>
                <button class="button danger" onclick="batchDislike()">批量点踩</button>
                <button class="button" onclick="batchDownload()">批量下载</button>
                <button class="button danger" onclick="batchDelete()">批量删除</button>
                <label><input type="checkbox" id="select-all" onchange="toggleSelectAll()"> 全选</label>
            </div>
            
            <div id="filter-result" class="result" style="display: none;"></div>
        </div>

        <!-- 简历上传测试 -->
        <div class="test-section">
            <h3>简历上传功能测试</h3>
            <p>测试文本粘贴、文件上传和URL导入功能</p>
            
            <div class="upload-area" onclick="showUploadModal()">
                <h4>点击上传简历</h4>
                <p>支持文本粘贴、文件上传、URL导入</p>
            </div>
            
            <button class="button" onclick="testTextPaste()">测试文本粘贴</button>
            <button class="button" onclick="testFileUpload()">测试文件上传</button>
            <button class="button" onclick="testURLImport()">测试URL导入</button>
            
            <div id="upload-result" class="result" style="display: none;"></div>
        </div>

        <!-- 统计信息显示 -->
        <div class="test-section">
            <h3>统计信息</h3>
            <div id="stats-display" class="stats"></div>
        </div>

        <!-- 简历列表显示 -->
        <div class="test-section">
            <h3>简历列表</h3>
            <div id="resume-list"></div>
        </div>
    </div>

    <script>
        // 模拟简历处理服务
        class MockResumeProcessingService {
            constructor() {
                this.collectedResumes = [];
                this.collectionLimit = 400;
                this.currentCollectionCount = 0;
            }

            // 模拟自动收藏
            async autoCollectCandidate(candidate) {
                if (this.currentCollectionCount >= this.collectionLimit) {
                    return {
                        success: false,
                        error: '已达到收藏上限400个，无法继续收藏'
                    };
                }

                // 模拟收藏过程
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                this.currentCollectionCount++;
                
                return {
                    success: true,
                    message: '收藏成功',
                    collectionCount: this.currentCollectionCount
                };
            }

            // 模拟简历入库
            async processResumeStorage(resumeData) {
                // 模拟入库过程
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                return {
                    success: true,
                    message: '入库成功',
                    resumeId: `resume_${Date.now()}`,
                    storageTime: new Date().toISOString()
                };
            }

            // 获取收藏统计
            getCollectionStatistics() {
                return {
                    currentCount: this.currentCollectionCount,
                    limit: this.collectionLimit,
                    remaining: this.collectionLimit - this.currentCollectionCount,
                    usageRate: Math.round((this.currentCollectionCount / this.collectionLimit) * 100)
                };
            }

            // 重置收藏计数
            resetCollectionCount() {
                this.currentCollectionCount = 0;
                return true;
            }
        }

        // 模拟简历数据
        let mockResumes = [
            {
                id: 1,
                candidateName: '张三',
                candidateTitle: '前端工程师',
                candidateCompany: '某某科技',
                candidateExperience: '3年',
                resumeText: '张三\n电话：13800138000\n邮箱：zhangsan@example.com\n应聘职位：前端工程师\n工作经验：3年\n学历：本科\n技能：JavaScript, React, Vue, Node.js',
                qualityScore: 85,
                isValid: true,
                status: 'collected',
                tags: ['前端开发', '中级', '高质量'],
                collectedAt: new Date().toISOString()
            },
            {
                id: 2,
                candidateName: '李四',
                candidateTitle: '后端工程师',
                candidateCompany: '某某软件',
                candidateExperience: '5年',
                resumeText: '李四\n电话：13900139000\n邮箱：lisi@example.com\n应聘职位：后端工程师\n工作经验：5年\n学历：硕士\n技能：Java, Spring Boot, MySQL, Redis',
                qualityScore: 92,
                isValid: true,
                status: 'collected',
                tags: ['后端开发', '资深', '高质量'],
                collectedAt: new Date().toISOString()
            },
            {
                id: 3,
                candidateName: '王五',
                candidateTitle: 'Python开发',
                candidateCompany: '某某网络',
                candidateExperience: '2年',
                resumeText: '王五\n电话：13700137000\n邮箱：wangwu@tech.com\n应聘职位：Python开发\n工作经验：2年\n学历：本科\n技能：Python, Django, Flask',
                qualityScore: 78,
                isValid: true,
                status: 'collected',
                tags: ['Python开发', '初级', '中等质量'],
                collectedAt: new Date().toISOString()
            }
        ];

        // 创建服务实例
        const processingService = new MockResumeProcessingService();

        // 测试自动收藏
        async function testAutoCollection() {
            const resultDiv = document.getElementById('collection-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '正在测试自动收藏功能...';
            
            try {
                const candidate = {
                    name: '赵六',
                    title: '产品经理',
                    company: '某某互联网',
                    experience: '4年'
                };
                
                const result = await processingService.autoCollectCandidate(candidate);
                
                if (result.success) {
                    resultDiv.className = 'result';
                    resultDiv.innerHTML = `
                        <h4>自动收藏成功！</h4>
                        <p><strong>候选人：</strong>${candidate.name}</p>
                        <p><strong>收藏数量：</strong>${result.collectionCount}</p>
                        <p><strong>剩余容量：</strong>${400 - result.collectionCount}</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `收藏失败: ${result.error}`;
                }
                
                updateStats();
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `测试失败: ${error.message}`;
            }
        }

        // 测试收藏上限
        function testCollectionLimit() {
            const resultDiv = document.getElementById('collection-result');
            resultDiv.style.display = 'block';
            
            const stats = processingService.getCollectionStatistics();
            
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                <h4>收藏上限测试</h4>
                <p><strong>当前收藏数：</strong>${stats.currentCount}</p>
                <p><strong>收藏上限：</strong>${stats.limit}</p>
                <p><strong>剩余容量：</strong>${stats.remaining}</p>
                <p><strong>使用率：</strong>${stats.usageRate}%</p>
            `;
        }

        // 重置收藏计数
        function resetCollectionCount() {
            processingService.resetCollectionCount();
            message.success('收藏计数已重置');
            updateStats();
        }

        // 测试简历入库
        async function testResumeStorage() {
            const resultDiv = document.getElementById('storage-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '正在测试简历入库功能...';
            
            try {
                const resumeData = {
                    candidateName: '测试候选人',
                    resumeText: '测试简历内容',
                    qualityScore: 80
                };
                
                const result = await processingService.processResumeStorage(resumeData);
                
                if (result.success) {
                    resultDiv.className = 'result';
                    resultDiv.innerHTML = `
                        <h4>简历入库成功！</h4>
                        <p><strong>简历ID：</strong>${result.resumeId}</p>
                        <p><strong>入库时间：</strong>${new Date(result.storageTime).toLocaleString()}</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `入库失败: ${result.error}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `测试失败: ${error.message}`;
            }
        }

        // 测试数据验证
        function testDataValidation() {
            const resultDiv = document.getElementById('storage-result');
            resultDiv.style.display = 'block';
            
            const testData = [
                { name: '张三', text: '完整简历内容', score: 85 },
                { name: '', text: '缺少姓名', score: 60 },
                { name: '李四', text: '内容过短', score: 30 }
            ];
            
            let html = '<h4>数据验证测试结果</h4>';
            testData.forEach(data => {
                const isValid = data.name && data.text.length > 50 && data.score >= 60;
                html += `
                    <p><strong>${data.name || '未命名'}：</strong>
                    <span style="color: ${isValid ? 'green' : 'red'}">
                        ${isValid ? '验证通过' : '验证失败'}
                    </span>
                    (姓名: ${data.name ? '✓' : '✗'}, 内容: ${data.text.length > 50 ? '✓' : '✗'}, 评分: ${data.score >= 60 ? '✓' : '✗'})
                    </p>
                `;
            });
            
            resultDiv.className = 'result';
            resultDiv.innerHTML = html;
        }

        // 测试数据标准化
        function testDataNormalization() {
            const resultDiv = document.getElementById('storage-result');
            resultDiv.style.display = 'block';
            
            const originalData = {
                candidateName: '张三',
                candidateTitle: '前端工程师',
                resumeText: '原始简历内容'
            };
            
            const normalizedData = {
                id: Date.now(),
                name: originalData.candidateName,
                title: originalData.candidateTitle,
                resumeContent: originalData.resumeText,
                status: 'stored',
                storedAt: new Date().toISOString(),
                source: 'boss_zhipin',
                tags: ['前端开发', '中等质量']
            };
            
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                <h4>数据标准化测试</h4>
                <p><strong>原始数据：</strong></p>
                <pre>${JSON.stringify(originalData, null, 2)}</pre>
                <p><strong>标准化后：</strong></p>
                <pre>${JSON.stringify(normalizedData, null, 2)}</pre>
            `;
        }

        // 更新质量评分范围显示
        function updateQualityRange() {
            const range = document.getElementById('quality-range');
            const value = document.getElementById('quality-value');
            value.textContent = range.value + '分';
            applyFilters();
        }

        // 应用筛选条件
        function applyFilters() {
            const qualityRange = parseInt(document.getElementById('quality-range').value);
            const experienceFilter = document.getElementById('experience-filter').value;
            const positionFilter = document.getElementById('position-filter').value;
            const keywordSearch = document.getElementById('keyword-search').value.toLowerCase();
            
            let filtered = mockResumes.filter(resume => {
                // 质量评分筛选
                if (resume.qualityScore < qualityRange) return false;
                
                // 工作经验筛选
                if (experienceFilter !== 'all') {
                    const exp = resume.candidateExperience;
                    switch (experienceFilter) {
                        case 'junior':
                            if (!exp.includes('1年') && !exp.includes('2年')) return false;
                            break;
                        case 'middle':
                            if (!exp.includes('3年') && !exp.includes('4年')) return false;
                            break;
                        case 'senior':
                            if (!exp.includes('5年') && !exp.includes('6年') && !exp.includes('7年') && !exp.includes('8年') && !exp.includes('9年') && !exp.includes('10年')) return false;
                            break;
                    }
                }
                
                // 职位类型筛选
                if (positionFilter !== 'all') {
                    const title = resume.candidateTitle.toLowerCase();
                    switch (positionFilter) {
                        case 'frontend':
                            if (!title.includes('前端')) return false;
                            break;
                        case 'backend':
                            if (!title.includes('后端')) return false;
                            break;
                        case 'fullstack':
                            if (!title.includes('全栈')) return false;
                            break;
                        case 'product':
                            if (!title.includes('产品')) return false;
                            break;
                        case 'design':
                            if (!title.includes('设计')) return false;
                            break;
                    }
                }
                
                // 关键词搜索
                if (keywordSearch) {
                    const searchText = `${resume.candidateName} ${resume.candidateTitle} ${resume.candidateCompany}`.toLowerCase();
                    if (!searchText.includes(keywordSearch)) return false;
                }
                
                return true;
            });
            
            displayResumeList(filtered);
            
            const resultDiv = document.getElementById('filter-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                <h4>筛选结果</h4>
                <p>找到 ${filtered.length} 份符合条件的简历</p>
                <p>筛选条件：质量评分≥${qualityRange}分, 工作经验=${experienceFilter === 'all' ? '全部' : experienceFilter}, 职位类型=${positionFilter === 'all' ? '全部' : positionFilter}</p>
            `;
        }

        // 显示简历列表
        function displayResumeList(resumes = mockResumes) {
            const listDiv = document.getElementById('resume-list');
            
            if (resumes.length === 0) {
                listDiv.innerHTML = '<p>没有找到符合条件的简历</p>';
                return;
            }
            
            let html = '';
            resumes.forEach(resume => {
                const statusClass = resume.status === 'liked' ? 'liked' : resume.status === 'disliked' ? 'disliked' : '';
                html += `
                    <div class="resume-card ${statusClass}">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <input type="checkbox" class="resume-checkbox" value="${resume.id}">
                                <strong>${resume.candidateName}</strong> - ${resume.candidateTitle}
                            </div>
                            <div>
                                <button class="button success" onclick="likeResume(${resume.id})" style="margin: 2px;">👍</button>
                                <button class="button danger" onclick="dislikeResume(${resume.id})" style="margin: 2px;">👎</button>
                                <button class="button" onclick="previewResume(${resume.id})" style="margin: 2px;">👁️</button>
                            </div>
                        </div>
                        <p><strong>公司：</strong>${resume.candidateCompany}</p>
                        <p><strong>工作经验：</strong>${resume.candidateExperience}</p>
                        <p><strong>质量评分：</strong>${resume.qualityScore}分</p>
                        <p><strong>状态：</strong>${resume.status === 'liked' ? '已点赞' : resume.status === 'disliked' ? '已点踩' : '未处理'}</p>
                        <p><strong>标签：</strong>${resume.tags.join(', ')}</p>
                    </div>
                `;
            });
            
            listDiv.innerHTML = html;
        }

        // 点赞简历
        function likeResume(resumeId) {
            mockResumes = mockResumes.map(resume => 
                resume.id === resumeId ? { ...resume, status: 'liked' } : resume
            );
            displayResumeList();
            updateStats();
            alert('简历已点赞');
        }

        // 点踩简历
        function dislikeResume(resumeId) {
            mockResumes = mockResumes.map(resume => 
                resume.id === resumeId ? { ...resume, status: 'disliked' } : resume
            );
            displayResumeList();
            updateStats();
            alert('简历已点踩');
        }

        // 预览简历
        function previewResume(resumeId) {
            const resume = mockResumes.find(r => r.id === resumeId);
            if (resume) {
                alert(`简历预览：\n\n${resume.resumeText.substring(0, 300)}...`);
            }
        }

        // 全选/取消全选
        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.resume-checkbox');
            const selectAll = document.getElementById('select-all');
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAll.checked;
            });
        }

        // 批量点赞
        function batchLike() {
            const selectedResumes = Array.from(document.querySelectorAll('.resume-checkbox:checked')).map(cb => parseInt(cb.value));
            if (selectedResumes.length === 0) {
                alert('请先选择简历');
                return;
            }
            
            mockResumes = mockResumes.map(resume => 
                selectedResumes.includes(resume.id) ? { ...resume, status: 'liked' } : resume
            );
            displayResumeList();
            updateStats();
            alert(`已批量点赞 ${selectedResumes.length} 份简历`);
        }

        // 批量点踩
        function batchDislike() {
            const selectedResumes = Array.from(document.querySelectorAll('.resume-checkbox:checked')).map(cb => parseInt(cb.value));
            if (selectedResumes.length === 0) {
                alert('请先选择简历');
                return;
            }
            
            mockResumes = mockResumes.map(resume => 
                selectedResumes.includes(resume.id) ? { ...resume, status: 'disliked' } : resume
            );
            displayResumeList();
            updateStats();
            alert(`已批量点踩 ${selectedResumes.length} 份简历`);
        }

        // 批量下载
        function batchDownload() {
            const selectedResumes = Array.from(document.querySelectorAll('.resume-checkbox:checked')).map(cb => parseInt(cb.value));
            if (selectedResumes.length === 0) {
                alert('请先选择简历');
                return;
            }
            
            alert(`开始批量下载 ${selectedResumes.length} 份简历`);
        }

        // 批量删除
        function batchDelete() {
            const selectedResumes = Array.from(document.querySelectorAll('.resume-checkbox:checked')).map(cb => parseInt(cb.value));
            if (selectedResumes.length === 0) {
                alert('请先选择简历');
                return;
            }
            
            if (confirm(`确定要删除选中的 ${selectedResumes.length} 份简历吗？`)) {
                mockResumes = mockResumes.filter(resume => !selectedResumes.includes(resume.id));
                displayResumeList();
                updateStats();
                alert(`已批量删除 ${selectedResumes.length} 份简历`);
            }
        }

        // 测试文本粘贴
        function testTextPaste() {
            const resultDiv = document.getElementById('upload-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                <h4>文本粘贴测试</h4>
                <p>请使用Ctrl+V粘贴简历内容到下方文本框：</p>
                <textarea id="paste-textarea" rows="10" cols="80" placeholder="在这里粘贴简历内容..."></textarea>
                <br><br>
                <button class="button" onclick="processPastedText()">处理粘贴内容</button>
            `;
        }

        // 处理粘贴的文本
        function processPastedText() {
            const textarea = document.getElementById('paste-textarea');
            const content = textarea.value.trim();
            
            if (!content) {
                alert('请先粘贴简历内容');
                return;
            }
            
            // 模拟解析过程
            const resultDiv = document.getElementById('upload-result');
            resultDiv.innerHTML = `
                <h4>文本处理结果</h4>
                <p><strong>内容长度：</strong>${content.length} 字符</p>
                <p><strong>处理状态：</strong>处理完成</p>
                <p><strong>建议：</strong>内容已成功解析，可以进行后续处理</p>
            `;
        }

        // 测试文件上传
        function testFileUpload() {
            const resultDiv = document.getElementById('upload-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                <h4>文件上传测试</h4>
                <p>请选择要上传的简历文件：</p>
                <input type="file" id="file-input" accept=".txt,.doc,.docx">
                <br><br>
                <button class="button" onclick="processUploadedFile()">处理上传文件</button>
            `;
        }

        // 处理上传的文件
        function processUploadedFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请先选择文件');
                return;
            }
            
            const resultDiv = document.getElementById('upload-result');
            resultDiv.innerHTML = `
                <h4>文件处理结果</h4>
                <p><strong>文件名：</strong>${file.name}</p>
                <p><strong>文件大小：</strong>${(file.size / 1024).toFixed(2)} KB</p>
                <p><strong>文件类型：</strong>${file.type || '未知'}</p>
                <p><strong>处理状态：</strong>处理完成</p>
            `;
        }

        // 测试URL导入
        function testURLImport() {
            const resultDiv = document.getElementById('upload-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                <h4>URL导入测试</h4>
                <p>请输入简历页面URL：</p>
                <input type="url" id="url-input" placeholder="https://example.com/resume" style="width: 300px;">
                <br><br>
                <button class="button" onclick="processURLImport()">开始导入</button>
            `;
        }

        // 处理URL导入
        function processURLImport() {
            const urlInput = document.getElementById('url-input');
            const url = urlInput.value.trim();
            
            if (!url) {
                alert('请输入有效的URL');
                return;
            }
            
            const resultDiv = document.getElementById('upload-result');
            resultDiv.innerHTML = `
                <h4>URL导入结果</h4>
                <p><strong>URL：</strong>${url}</p>
                <p><strong>状态：</strong>正在导入...</p>
            `;
            
            // 模拟导入过程
            setTimeout(() => {
                resultDiv.innerHTML = `
                    <h4>URL导入结果</h4>
                    <p><strong>URL：</strong>${url}</p>
                    <p><strong>状态：</strong>导入完成</p>
                    <p><strong>内容：</strong>已成功从URL获取简历内容</p>
                `;
            }, 2000);
        }

        // 显示上传模态框
        function showUploadModal() {
            alert('简历上传功能已集成到主系统中，请在主界面使用');
        }

        // 更新统计信息
        function updateStats() {
            const statsDiv = document.getElementById('stats-display');
            const total = mockResumes.length;
            const liked = mockResumes.filter(r => r.status === 'liked').length;
            const disliked = mockResumes.filter(r => r.status === 'disliked').length;
            const collected = mockResumes.filter(r => r.status === 'collected').length;
            const avgScore = total > 0 ? 
                mockResumes.reduce((sum, r) => sum + r.qualityScore, 0) / total : 0;
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${total}</div>
                    <div class="stat-label">总简历数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${liked}</div>
                    <div class="stat-label">已点赞</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${disliked}</div>
                    <div class="stat-label">已点踩</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${collected}</div>
                    <div class="stat-label">已采集</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${Math.round(avgScore)}</div>
                    <div class="stat-label">平均质量分</div>
                </div>
            `;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            displayResumeList();
            updateStats();
        });
    </script>
</body>
</html>
