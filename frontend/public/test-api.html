<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能寻聘API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #1890ff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #40a9ff; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>智能寻聘API测试</h1>
    
    <div class="test-section">
        <h3>1. 获取任务列表</h3>
        <button onclick="getTasks()">获取任务</button>
        <div id="tasksResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. 测试智能寻聘状态切换</h3>
        <button onclick="testToggle()">测试切换</button>
        <div id="toggleResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. 获取统计数据</h3>
        <button onclick="getStats()">获取统计</button>
        <div id="statsResult" class="result"></div>
    </div>

    <script>
        let currentTaskId = null;
        
        async function getTasks() {
            try {
                const response = await fetch('/api/tasks');
                const result = await response.json();
                
                if (result.success) {
                    const tasks = result.data;
                    currentTaskId = tasks[0]?.id;
                    
                    const html = `
                        <div class="success">
                            <strong>成功获取 ${tasks.length} 个任务</strong><br>
                            第一个任务: ${tasks[0]?.title} (ID: ${currentTaskId})<br>
                            智能寻聘: ${tasks[0]?.smartRecruitment}<br>
                            寻聘状态: ${tasks[0]?.recruitmentStatus}
                        </div>
                    `;
                    document.getElementById('tasksResult').innerHTML = html;
                } else {
                    document.getElementById('tasksResult').innerHTML = `<div class="error">获取任务失败: ${result.message}</div>`;
                }
            } catch (error) {
                document.getElementById('tasksResult').innerHTML = `<div class="error">请求失败: ${error.message}</div>`;
            }
        }
        
        async function testToggle() {
            if (!currentTaskId) {
                document.getElementById('toggleResult').innerHTML = '<div class="error">请先获取任务列表</div>';
                return;
            }
            
            try {
                const response = await fetch(`/api/tasks/${currentTaskId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        smartRecruitment: true,
                        recruitmentStatus: '进行中'
                    }),
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const html = `
                        <div class="success">
                            <strong>切换成功!</strong><br>
                            任务ID: ${currentTaskId}<br>
                            智能寻聘: ${result.data.smartRecruitment}<br>
                            寻聘状态: ${result.data.recruitmentStatus}<br>
                            更新时间: ${result.data.updatedAt}
                        </div>
                    `;
                    document.getElementById('toggleResult').innerHTML = html;
                } else {
                    document.getElementById('toggleResult').innerHTML = `<div class="error">切换失败: ${result.message}</div>`;
                }
            } catch (error) {
                document.getElementById('toggleResult').innerHTML = `<div class="error">请求失败: ${error.message}</div>`;
            }
        }
        
        async function getStats() {
            try {
                const response = await fetch('/api/tasks/stats');
                const result = await response.json();
                
                if (result.success) {
                    const stats = result.data;
                    const html = `
                        <div class="success">
                            <strong>统计数据:</strong><br>
                            总任务数: ${stats.total}<br>
                            智能寻聘开启: ${stats.smartRecruitmentEnabled}<br>
                            寻聘进行中: ${stats.recruitmentInProgress}<br>
                            寻聘已完成: ${stats.recruitmentCompleted}<br>
                            寻聘已暂停: ${stats.recruitmentPaused}
                        </div>
                    `;
                    document.getElementById('statsResult').innerHTML = html;
                } else {
                    document.getElementById('statsResult').innerHTML = `<div class="error">获取统计失败: ${result.message}</div>`;
                }
            } catch (error) {
                document.getElementById('statsResult').innerHTML = `<div class="error">请求失败: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
